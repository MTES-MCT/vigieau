name: vigieau

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: regleau
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regleau"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./docker/minio:/seed:ro
    entrypoint:
      - /bin/sh
      - -c
    command: |
      set -e

      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1
      done

      mc mb --ignore-existing local/vigieau
      mc anonymous set download local/vigieau

      if [ -f /seed/cors.json ]; then
        mc cors set local/vigieau /seed/cors.json
      fi

      if [ -f /seed/zones_arretes_en_vigueur.pmtiles ]; then
        mc cp /seed/zones_arretes_en_vigueur.pmtiles local/vigieau/local/pmtiles/zones_arretes_en_vigueur.pmtiles
      else
        echo "Pas de /seed/zones_arretes_en_vigueur.pmtiles : le frontend utilisera PMTILES_URL si renseigné."
      fi
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    environment:
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
