name: Collecte et notification des incidents production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: Executer aussi les six smokes stricts
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: production-incidents
  cancel-in-progress: false

jobs:
  collect-and-notify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VIGIEAU_MONITOR_DEEP: ${{ github.event.schedule == '17 */6 * * *' || inputs.deep == true }}
      VIGIEAU_INCIDENT_ASSIGNEE: sghribi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect health, publish explicit checks, persist incidents and notify transitions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/production-incidents.mjs
